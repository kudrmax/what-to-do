<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Plans" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1c1a" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="./src/phone/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./src/phone/apple-touch-icon.png" />
    <title>Plans</title>
    <script>
      // Follows the system look before the first paint; src/app/theme.ts keeps it after that.
      (function () {
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var root = document.documentElement;
        root.dataset.theme = dark ? "dark" : "light";
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/phone/main.tsx"></script>
  </body>
</html>
